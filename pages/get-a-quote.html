<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Get a Quote | HR & Labour Law Services | NGWS South Africa</title>
  <meta name="description" content="Get a custom quote for HR consulting, labour law, polygraph testing and more from NextGen Workforce Solutions. No generic packages — tailored to your business.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<script src="../js/components.js"></script><script>initPage('');</script>

<section class="page-hero"><div class="container">
  <div style="max-width:640px">
    <span class="section-label">Get a Quote</span>
    <h1>Get a Custom Quote for Your Business</h1>
    <p>No generic packages. We build a solution tailored to your specific needs, size, and budget.</p>
  </div>
</div></section>

<section class="section"><div class="container">
  <div style="max-width:720px;margin:0 auto">
    <form id="quote-form">
      <div class="form-row">
        <div class="form-group"><label>Full Name *</label><input type="text" placeholder="Your full name" required></div>
        <div class="form-group"><label>Company Name *</label><input type="text" placeholder="Your company" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Number of Employees</label><input type="number" placeholder="e.g. 25"></div>
        <div class="form-group"><label>Monthly Budget Range</label>
          <select>
            <option value="">Select budget range...</option>
            <option>Under R2 000 / month</option>
            <option>R2 000 – R5 000 / month</option>
            <option>R5 000 – R10 000 / month</option>
            <option>R10 000+ / month</option>
            <option>Not sure yet</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Services Needed (select all that apply)</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">
          <label style="display:flex;gap:8px;align-items:center;font-weight:400;cursor:pointer"><input type="checkbox"> HR Consulting</label>
          <label style="display:flex;gap:8px;align-items:center;font-weight:400;cursor:pointer"><input type="checkbox"> Labour Law Compliance</label>
          <label style="display:flex;gap:8px;align-items:center;font-weight:400;cursor:pointer"><input type="checkbox"> Disciplinary Hearing Support</label>
          <label style="display:flex;gap:8px;align-items:center;font-weight:400;cursor:pointer"><input type="checkbox"> CCMA Representation</label>
          <label style="display:flex;gap:8px;align-items:center;font-weight:400;cursor:pointer"><input type="checkbox"> Polygraph Testing</label>
          <label style="display:flex;gap:8px;align-items:center;font-weight:400;cursor:pointer"><input type="checkbox"> Employment Equity</label>
          <label style="display:flex;gap:8px;align-items:center;font-weight:400;cursor:pointer"><input type="checkbox"> Criminal Background Checks</label>
          <label style="display:flex;gap:8px;align-items:center;font-weight:400;cursor:pointer"><input type="checkbox"> Digital HR System</label>
          <label style="display:flex;gap:8px;align-items:center;font-weight:400;cursor:pointer"><input type="checkbox"> Payroll Processing</label>
          <label style="display:flex;gap:8px;align-items:center;font-weight:400;cursor:pointer"><input type="checkbox"> Business Support Package</label>
          <label style="display:flex;gap:8px;align-items:center;font-weight:400;cursor:pointer"><input type="checkbox"> Full HR Audit</label>
          <label style="display:flex;gap:8px;align-items:center;font-weight:400;cursor:pointer"><input type="checkbox"> Compliance & Risk Review</label>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Best Time to Call</label>
          <select>
            <option>Morning (8am – 12pm)</option>
            <option>Afternoon (12pm – 5pm)</option>
            <option>Either</option>
          </select>
        </div>
        <div class="form-group"><label>Phone Number *</label><input type="tel" placeholder="083 000 0000" required></div>
      </div>
      <div class="form-group"><label>Email Address *</label><input type="email" placeholder="your@email.com" required></div>
      <div class="form-group"><label>Anything else we should know?</label><textarea placeholder="Tell us about your specific situation or requirements..."></textarea></div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Request My Custom Quote →</button>
      <p style="text-align:center;font-size:0.8rem;margin-top:12px">We respond within 24 hours. No obligation, no pressure.</p>
    </form>
  </div>
</div></section>

<script src="../js/main.js"></script></body></html>
