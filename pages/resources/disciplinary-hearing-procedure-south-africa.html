    img: 'https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=900&q=80',

      <p>Receiving a CCMA referral can feel overwhelming — but understanding the process removes much of the uncertainty. This guide explains the CCMA process in plain language so you know exactly what to expect and how to prepare.</p>
      <h2>What Is the CCMA?</h2>
      <p>The Commission for Conciliation, Mediation and Arbitration (CCMA) is a statutory body established under the Labour Relations Act to resolve workplace disputes between employers and employees. It is independent, and its services are free to use.</p>
      <h2>When Can an Employee Refer a Case to the CCMA?</h2>
      <p>Employees can refer disputes relating to unfair dismissal, unfair labour practice, workplace discrimination, and certain retrenchment matters. Most referrals must be made within 30 days of the dismissal or dispute arising.</p>
      <h2>The CCMA Process Step by Step</h2>
      <ul>
        <li><strong>Referral:</strong> The employee completes a LRA Form 7.11 and submits it to the CCMA. You receive a copy and a date for conciliation.</li>
        <li><strong>Conciliation:</strong> Both parties meet with a CCMA commissioner who attempts to facilitate a settlement. This is informal and without prejudice.</li>
        <li><strong>Certificate of Non-Resolution:</strong> If conciliation fails, the commissioner issues a certificate and the employee may proceed to arbitration.</li>
        <li><strong>Arbitration:</strong> A formal hearing where both parties present evidence. The commissioner then issues a binding arbitration award.</li>
      </ul>
      <h2>Common Employer Mistakes at the CCMA</h2>
      <ul>

      <p>Running a disciplinary hearing incorrectly — even when the employee is clearly guilty — can result in a finding of procedural unfairness at the CCMA and a compensation award against your business. This guide explains the correct procedure.</p>
      <h2>The Legal Framework: LRA Schedule 8</h2>
      <p>Disciplinary hearings in South Africa must comply with the Code of Good Practice: Dismissal, contained in Schedule 8 of the Labour Relations Act. This sets out what constitutes both a substantively and procedurally fair dismissal.</p>
      <h2>Step-by-Step Disciplinary Hearing Procedure</h2>
      <ul>
        <li><strong>Step 1 — Investigation:</strong> Before charging anyone, conduct a thorough investigation to establish the facts. Document everything.</li>
        <li><strong>Step 2 — Notice to Attend:</strong> Give the employee written notice of the charges, the date and time of the hearing, and their right to representation. Allow reasonable preparation time (usually 48 hours minimum).</li>
        <li><strong>Step 3 — The Hearing:</strong> Both the employer and employee present their case. The employee has the right to be heard, call witnesses, and cross-examine the employer's witnesses.</li>
        <li><strong>Step 4 — Finding and Sanction:</strong> The chairperson makes a finding of guilty or not guilty and imposes an appropriate sanction if guilty.</li>
        <li><strong>Step 5 — Written Outcome:</strong> Provide the employee with a written outcome stating the finding, sanction, and reasons.</li>
      </ul>
      <h2>What a Charge Sheet Must Contain</h2>
      <ul>
        <li>The specific allegations of misconduct</li>
        <li>The relevant workplace rule or policy that was breached</li>
        <li>The date, time, and place of the alleged misconduct</li>
        <li>The hearing date, time, and location</li>
        <li>The employee's rights (to representation, to call witnesses)</li>
      </ul>
      <h2>Most Common Procedural Errors</h2>
      <ul>
        <li>Insufficient notice of the hearing</li>
        <li>Not allowing the employee to respond to the charges</li>

        <li>Failing to give a written outcome with reasons</li>

      <p>The Employment Equity Act (EEA) is one of the most commonly misunderstood pieces of legislation affecting South African businesses. This guide explains who must comply, what's required, and what happens if you don't.</p>
      <h2>What Does the Employment Equity Act Require?</h2>
      <p>The EEA requires designated employers to take active steps to promote equal opportunity and eliminate unfair discrimination in the workplace. It also requires designated employers to implement affirmative action measures to ensure equitable representation of previously disadvantaged groups.</p>
      <h2>Who Is a Designated Employer?</h2>
      <ul>
        <li>Employers with 50 or more employees</li>
        <li>Employers with fewer than 50 employees but with an annual turnover meeting the threshold for their sector</li>
        <li>Municipalities and organs of state</li>
        <li>Employers who have been ordered to comply by a bargaining council or the Labour Court</li>
      </ul>
      <p>If you employ fewer than 50 people and your turnover is below the relevant threshold, you are not a designated employer — but you are still required not to discriminate unfairly.</p>
      <h2>What Does an EE Plan Need to Include?</h2>

        <li>Workforce analysis showing current representation</li>
        <li>Affirmative action goals and targets per occupational level</li>
        <li>Measures to address identified barriers to employment equity</li>
        <li>Timeframes for achieving transformation targets</li>
        <li>Procedures for monitoring and evaluating implementation</li>
      </ul>
      <h2>Annual Submission Requirements</h2>
