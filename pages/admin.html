<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin Login | NGWS</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background:var(--bg-grey)">
<div class="admin-login">
  <div class="admin-login-box">
    <div style="font-size:2.5rem;margin-bottom:12px">🔐</div>
    <h2 style="color:var(--navy);margin-bottom:6px">NGWS Admin</h2>
    <p style="font-size:0.9rem;margin-bottom:28px">Sign in to manage articles and content</p>
    <p class="login-error" style="display:none;color:#B91C1C;background:#FEE2E2;padding:10px 14px;border-radius:8px;font-size:0.85rem;margin-bottom:16px"></p>
    <form id="admin-login-form" style="text-align:left">
      <div class="form-group"><label>Username</label><input id="admin-user" type="text" placeholder="Username" required autocomplete="username"></div>
      <div class="form-group"><label>Password</label><input id="admin-pass" type="password" placeholder="Password" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Sign In →</button>
    </form>
    <p style="font-size:0.75rem;color:var(--text-light);margin-top:20px">
      <a href="javascript:history.back()" style="color:var(--blue)">← Back to website</a>
    </p>
  </div>
</div>
<script src="../js/main.js"></script>
</body></html>
